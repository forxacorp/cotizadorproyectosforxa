<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrar — Cotizador FORXA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9881;</text></svg>">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="internal-bar no-print">Panel de administración · solo admins</div>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="FORXA Inmobiliaria" onerror="this.style.display='none'">
      <span class="brand-text"><strong>FORXA</strong><span>Administrar cotizador</span></span>
    </a>
    <div class="header-actions" id="header-actions"></div>
  </div>
</header>

<main class="wrap" style="padding-top:28px;padding-bottom:64px;">

  <div class="card">
    <h3>Proyectos</h3>
    <div id="project-list" class="admin-table-wrap"><div class="empty-state">Cargando…</div></div>
  </div>

  <div class="card">
    <h3 id="project-form-title">Agregar proyecto nuevo</h3>
    <p class="hint" style="margin-bottom:14px;">Elige el slug con cuidado (letras minúsculas, sin espacios) — es el identificador interno y no se puede cambiar después.</p>
    <form id="project-form">
      <div class="row2">
        <div class="field"><label>Slug (id único) *</label><input type="text" id="p-id" placeholder="ej. nuevoproyecto" pattern="[a-z0-9\-]+" required></div>
        <div class="field"><label>Nombre *</label><input type="text" id="p-nombre" required></div>
      </div>
      <div class="field"><label>Descripción corta</label><input type="text" id="p-tagline"></div>
      <div class="row2">
        <div class="field"><label>Color primario</label><input type="color" id="p-color1" value="#565a41"></div>
        <div class="field"><label>Color de acento</label><input type="color" id="p-color2" value="#cdbd94"></div>
      </div>
      <div class="field">
        <label>Tipo de financiamiento</label>
        <select id="p-tipo">
          <option value="simulacion">Simulación de crédito (reserva % + promesa % + tasa/plazo editable)</option>
          <option value="vip_fijo">Crédito fijo tipo VIP (reserva % + tasa/plazo fijos)</option>
          <option value="lote">Lote (solo entrada, saldo a coordinar)</option>
        </select>
      </div>
      <div class="row2">
        <div class="field"><label>Reserva (%)</label><input type="number" id="p-reserva" step="0.01" value="0.05"></div>
        <div class="field"><label>Promesa (%)</label><input type="number" id="p-promesa" step="0.01" value="0"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Tasa por defecto (%)</label><input type="number" id="p-tasa" step="0.01" value="10.5"></div>
        <div class="field"><label>Plazo por defecto (años)</label><input type="number" id="p-plazo" value="20"></div>
      </div>
      <div class="field"><label><input type="checkbox" id="p-multi" style="width:auto;margin-right:8px;">Permite seleccionar varias unidades para comparar</label></div>
      <div class="field"><label><input type="checkbox" id="p-desc" style="width:auto;margin-right:8px;">Permite descuento manual por clics</label></div>
      <div class="field" id="p-desc-monto-wrap" hidden><label>Monto por clic (USD)</label><input type="number" id="p-desc-monto" value="500"></div>
      <div class="field">
        <label>Portada (imagen)</label>
        <input type="file" id="p-cover" accept="image/*">
      </div>
      <input type="hidden" id="p-editing-id">
      <div style="display:flex;gap:10px;">
        <button type="submit" class="btn btn-primary">Guardar proyecto</button>
        <button type="button" class="btn btn-ghost" id="p-cancel" hidden>Cancelar edición</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h3>Unidades</h3>
    <div class="field" style="max-width:320px;">
      <label>Proyecto</label>
      <select id="unit-project-select"></select>
    </div>
    <div id="unit-list" class="admin-table-wrap"></div>
    <button class="btn btn-ghost btn-sm" id="add-unit-btn" style="margin-top:14px;">+ Agregar unidad</button>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
